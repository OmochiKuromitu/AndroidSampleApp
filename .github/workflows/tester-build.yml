# テスターさん向けに APK を作り、Google ドライブの共有ドライブに置いて Slack に知らせる。
# 準備（署名の鍵、Google Cloud、共有ドライブ、Slack）と、ビルドする構成やブランチの変え方は docs/tester-build.md。
name: tester-build

on:
  push:
    # 自動でビルドするブランチ。変えるときはここを書き換える。
    # ほかのブランチは、Actions の画面から手で実行するときに選べる（下の workflow_dispatch）。
    branches: [develop]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'flavor（product: 本番の接続先 / mock: 通信を mock にする）'
        type: choice
        options: [product, mock]
        default: product
      build_type:
        description: 'ビルドタイプ'
        type: choice
        options: [release, debug]
        default: release

# 同じブランチで続けて push されたら、古いほうは止めて新しいほうだけ配る。
concurrency:
  group: tester-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Google Cloud の Workload Identity 連携で、鍵ファイルを使わずに認証するために要る。
  id-token: write

jobs:
  build:
    name: APK を作って配る
    runs-on: ubuntu-latest
    env:
      # 手で実行したときは画面で選んだ値。push のときは入力が無いので、
      # リポジトリ変数（Settings > Secrets and variables > Actions > Variables）、それも無ければ product / release。
      FLAVOR: ${{ inputs.flavor || vars.TESTER_BUILD_FLAVOR || 'product' }}
      BUILD_TYPE: ${{ inputs.build_type || vars.TESTER_BUILD_TYPE || 'release' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - id: meta
        name: タスク名とファイル名を決める
        run: |
          case "$FLAVOR" in product|mock) ;; *) echo "::error::flavor は product か mock: $FLAVOR"; exit 1 ;; esac
          case "$BUILD_TYPE" in release|debug) ;; *) echo "::error::ビルドタイプは release か debug: $BUILD_TYPE"; exit 1 ;; esac
          sha="${GITHUB_SHA::7}"
          echo "task=assemble${FLAVOR^}${BUILD_TYPE^}" >> "$GITHUB_OUTPUT"
          echo "name=AndroidSampleApp-${FLAVOR}-${BUILD_TYPE}-${{ github.run_number }}-${sha}.apk" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # release は署名しないと端末に入れられないので、Secrets の鍵で署名する。
      # debug は Gradle が作る debug 用の鍵で署名されるので要らない。
      - name: 署名の鍵を用意する（release のとき）
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets の RELEASE_KEYSTORE_BASE64 が未設定です（docs/tester-build.md の「署名の鍵」）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK を作る
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew "${{ steps.meta.outputs.task }}"
          # 署名されていない APK（-unsigned）は入れられないので拾わない。
          apk="$(find "app/build/outputs/apk/$FLAVOR/$BUILD_TYPE" -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::署名済みの APK が見つかりません"
            exit 1
          fi
          mkdir -p out
          cp "$apk" "out/${{ steps.meta.outputs.name }}"

      # ドライブに置けなかったときにも取り出せるよう、Actions の成果物にも残す。
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: out/${{ steps.meta.outputs.name }}
          retention-days: 30

      - id: auth
        name: Google Cloud に認証する
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      - id: drive
        name: 共有ドライブにアップロードする
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          if [ -z "$FOLDER_ID" ]; then
            echo "::error::リポジトリ変数の DRIVE_FOLDER_ID が未設定です（docs/tester-build.md の「共有ドライブ」）"
            exit 1
          fi
          metadata="$(jq -nc --arg name "$NAME" --arg parent "$FOLDER_ID" '{name: $name, parents: [$parent]}')"
          # supportsAllDrives=true が無いと、共有ドライブのフォルダが見つからない（404）。
          res="$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" \
            -F "metadata=${metadata};type=application/json;charset=UTF-8" \
            -F "file=@out/${NAME};type=application/vnd.android.package-archive" \
            -w '\n%{http_code}' \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,webViewLink")"
          code="$(tail -n 1 <<< "$res")"
          body="$(sed '$d' <<< "$res")"
          if [ "$code" != "200" ]; then
            echo "::error::アップロードに失敗しました（HTTP $code）"
            echo "$body"
            exit 1
          fi
          link="$(jq -r .webViewLink <<< "$body")"
          echo "link=$link" >> "$GITHUB_OUTPUT"
          echo "アップロードしました: $link"

      - name: Slack に知らせる
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          LINK: ${{ steps.drive.outputs.link }}
          NAME: ${{ steps.meta.outputs.name }}
          SHA: ${{ steps.meta.outputs.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::Secrets の SLACK_WEBHOOK_URL が未設定なので、Slack には知らせません"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            text="テスター向けビルド #${RUN_NUMBER} を置きました
          ブランチ: ${BRANCH}（${SHA}）
          構成: ${FLAVOR} / ${BUILD_TYPE}
          APK: <${LINK}|${NAME}>"
          else
            text="テスター向けビルド #${RUN_NUMBER} が失敗しました（${STATUS}）
          ブランチ: ${BRANCH}（${SHA}）
          構成: ${FLAVOR} / ${BUILD_TYPE}
          ログ: <${RUN_URL}|Actions の実行結果>"
          fi
          # YAML の字下げで行頭に入る空白を取る。
          text="$(sed 's/^ *//' <<< "$text")"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg text "$text" '{text: $text}')" "$WEBHOOK"
